name: KaraDugum 6.56 Android 15 and 16 minified WebView smoke
on:
  push:
    branches: [audit/6.56-android-emulator-20261125]
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KD_ADS_MODE: test
      KD_VERSION_NAME: '6.56'
      KD_VERSION_CODE: '119'
      KEYSTORE_PASSWORD: android
      KEY_ALIAS: androiddebugkey
      KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare a disposable test-only package
        run: |
          set -euo pipefail
          bash scripts/prepare-android-rc.sh
          rm app/src/androidTest/java/com/orynexa/karadugum/PocoEnergyUpgradeAudit.java
          cp tests/android/PerformanceCandidateAudit.java app/src/androidTest/java/com/orynexa/karadugum/
          keytool -genkeypair -keystore app/karadugum.jks -storepass android -alias androiddebugkey -keypass android -dname 'CN=Disposable QA' -keyalg RSA -keysize 2048 -validity 30
          gradle --no-daemon :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android WebView and bridge test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 -skin 720x1600 -dpi-device 320
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -r -e class com.orynexa.karadugum.PerformanceCandidateAudit com.orynexa.karadugum.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/android-results.txt"
            grep -q 'OK (1 test)' "$RUNNER_TEMP/android-results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}-result
          path: ${{ runner.temp }}/android-results.txt
          if-no-files-found: warn
