name: KaraDugum cloud recovery verification
on:
  push:
    branches: [fix/cloud-account-recovery-654]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/cloud-account-recovery-654'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KD_ADS_MODE: test
      KD_VERSION_NAME: 6.54-cloud-check
      KD_VERSION_CODE: '117'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cloud and account regression tests
        run: |
          node --check cloud-sync.js
          node tests/cloud-model-audit.cjs
          node tests/native-cloud-callback-audit.cjs
      - name: Verify actual Android SDK compilation
        run: |
          bash scripts/prepare-android-rc.sh
          gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac :app:lintDebug
