name: KaraDugum Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: KaraDugum v6.4 APK ve AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini hazirla
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html || { echo 'HATA: index.html eksik'; exit 1; }
          test -s MainActivity.java || { echo 'HATA: MainActivity.java eksik'; exit 1; }
          mkdir -p app/src/main/java/com/karadugum/puzzle app/src/main/assets app/src/main/res
          cp MainActivity.java app/src/main/java/com/karadugum/puzzle/MainActivity.java
          cp index.html app/src/main/assets/index.html
          if [ -d android-icons ]; then
            cp -R android-icons/. app/src/main/res/
          fi
          # Eksik ikonlar varsa kokteki icon.png dosyasini kullan.
          # O da yoksa harici kutuphane gerektirmeyen basit bir PNG uret.
          if [ -f icon.png ]; then
            SOURCE_ICON=icon.png
          else
            python3 - <<'PY'
          import struct, zlib
          size = 192
          rows = []
          for y in range(size):
              row = bytearray()
              for x in range(size):
                  border = x < 10 or y < 10 or x >= size-10 or y >= size-10
                  grid = ((x in range(35,45) or x in range(90,100) or x in range(145,155)) and 30 < y < 160) or ((y in range(35,45) or y in range(90,100) or y in range(145,155)) and 30 < x < 160)
                  row.extend((215,169,72,255) if border or grid else (17,20,29,255))
              rows.append(b'\x00' + bytes(row))
          def chunk(tag, data):
              return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
          with open('icon-generated.png','wb') as f:
              f.write(b'\x89PNG\r\n\x1a\n')
              f.write(chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0)))
              f.write(chunk(b'IDAT',zlib.compress(b''.join(rows))))
              f.write(chunk(b'IEND',b''))
          PY
            SOURCE_ICON=icon-generated.png
          fi
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$density"
            if [ ! -s "app/src/main/res/mipmap-$density/ic_launcher.png" ]; then
              cp "$SOURCE_ICON" "app/src/main/res/mipmap-$density/ic_launcher.png"
            fi
          done
          # Firebase konfigurasyonu mevcutsa etkinlestir.
          if [ -s google-services.json ]; then
            cp google-services.json app/google-services.json
            FIREBASE_PLUGIN="id 'com.google.gms.google-services'"
          else
            FIREBASE_PLUGIN=''
          fi
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <application android:label="KARA DÜĞÜM" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'KaraDugum'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF
          cat > app/build.gradle <<EOF
          plugins {
            id 'com.android.application'
            $FIREBASE_PLUGIN
          }
          android {
            namespace 'com.karadugum.puzzle'
            compileSdk 35
            defaultConfig {
              applicationId 'com.karadugum.puzzle'
              minSdk 23
              targetSdk 35
              versionCode 64
              versionName '6.4'
            }
            signingConfigs {
              release {
                storeFile file('karadugum.jks')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation platform('com.google.firebase:firebase-bom:33.7.0')
            implementation 'com.google.firebase:firebase-auth'
            implementation 'com.google.firebase:firebase-database'
            implementation 'com.google.android.gms:play-services-auth:21.3.0'
          }
          EOF

      - name: Mevcut imza anahtarini kontrol et
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || { echo "HATA: $name eksik veya bos"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/karadugum.jks
          keytool -list -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /tmp/karadugum-cert.der
          echo "EXPECTED_SHA256=$(sha256sum /tmp/karadugum-cert.der | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo 'Mevcut imza sertifikasi dogrulandi.'

      - name: APK ve AAB olustur
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: APK sertifikasini dogrula
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-cert.txt
          ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-cert.txt | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED" || { echo 'HATA: APK imzasi beklenen sertifikayla eslesmiyor'; exit 1; }
          echo 'APK sertifikasi dogrulandi.'

      - name: APK ve AAB dosyalarini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v6.4-APK-ve-AAB
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
