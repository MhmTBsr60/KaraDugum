name: Capture authentic Kara Dugum 6.58 gameplay for video ads
on:
  push:
    branches: [media/6.58-ad-video-capture]
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/ad-video-capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-6.58-authentic-gameplay
          path: ad-capture/
          if-no-files-found: error
