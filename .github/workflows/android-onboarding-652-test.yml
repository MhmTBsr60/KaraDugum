name: KaraDugum 6.52 (115) tutorial TEST
on:
  push:
    branches: [fix/6.52-onboarding-flow]
  workflow_dispatch:
jobs:
  android-webview:
    if: ${{ github.ref == 'refs/heads/fix/6.52-onboarding-flow' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, upgrade]
    env:
      KD_ADS_MODE: test
      KD_VERSION_NAME: '6.52'
      KD_VERSION_CODE: '115'
      KD_TEST_VERSION: '6.52'
      KD_EXPECTED_SIGNER: 351b49b72bfc09ebb317769832319eadca9ded6dae709daeb8314719a53dee9e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/download-artifact@v4
        if: matrix.scenario == 'upgrade'
        with:
          name: KaraDugum-6.51-114-signed-production-AAB
          github-token: ${{ github.token }}
          run-id: '44730919930'
          path: ${{ runner.temp }}/baseline-114
      - name: Build and verify signed TEST APK with lint
        id: build_test
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KD_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          node tests/ux-protected-core.cjs
          bash scripts/prepare-android-rc.sh
          umask 077
          trap 'rm -f app/karadugum.jks "$RUNNER_TEMP/ks-pass" "$RUNNER_TEMP/key-pass"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/karadugum.jks
          printf '%s\n' "$KD_EXPECTED_SIGNER" > "$RUNNER_TEMP/expected-cert-sha256"
          tasks=(:app:assembleRelease :app:lintRelease :app:assembleReleaseAndroidTest)
          if gradle --no-daemon --stacktrace "${tasks[@]}" > "$RUNNER_TEMP/build.log" 2>&1; then
            tail -n 25 "$RUNNER_TEMP/build.log"
          else
            tail -n 120 "$RUNNER_TEMP/build.log"
            grep -Eq 'Could not (find junit:junit:4.13.2|resolve.*https?://)|Received status code (429|50[0-9])' "$RUNNER_TEMP/build.log"
            if grep -q 'Received status code 429' "$RUNNER_TEMP/build.log"; then
              sed -i "s|mavenCentral()|maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }|g" settings.gradle
            fi
            gradle --no-daemon --refresh-dependencies --stacktrace "${tasks[@]}"
          fi
          apk=app/build/outputs/apk/release/app-release.apk
          bash scripts/verify-apk-signature.sh "$apk" "$RUNNER_TEMP/expected-cert-sha256"
          python3 scripts/verify-test-apk.py "$apk"
          mkdir -p dist/tutorial
          python3 scripts/verify-rc-assets.py --package "$apk" --report dist/tutorial/test-assets.json
          cp app/build/reports/lint-results-release.xml dist/tutorial/
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" sign --ks app/karadugum.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          if [[ "$KD_SCENARIO" == upgrade ]]; then
            bundle="$RUNNER_TEMP/baseline-114/KaraDugum-6.51-114-LIVE.aab"
            echo "e253770e2424858a8066db27660f27a6e0abb21be521516acd9d5018c22f2efe  $bundle" | sha256sum --check
            bundletool="$RUNNER_TEMP/kd-bundletool.jar"
            curl --fail --silent --show-error --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$bundletool"
            echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum --check
            printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks-pass"
            printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key-pass"
            java -jar "$bundletool" build-apks --bundle="$bundle" --mode=universal --output="$RUNNER_TEMP/baseline.apks" --ks=app/karadugum.jks --ks-key-alias="$KEY_ALIAS" --ks-pass="file:$RUNNER_TEMP/ks-pass" --key-pass="file:$RUNNER_TEMP/key-pass"
            unzip -p "$RUNNER_TEMP/baseline.apks" universal.apk > "$RUNNER_TEMP/baseline-114.apk"
            bash scripts/verify-apk-signature.sh "$RUNNER_TEMP/baseline-114.apk" "$RUNNER_TEMP/expected-cert-sha256"
          fi
          sudo chmod 666 /dev/kvm
      - name: Verify onboarding and saved purchases with real touches on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KD_SCENARIO: ${{ matrix.scenario }}
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 -skin 720x1600 -dpi-device 320
          script: bash scripts/run-onboarding-android-audit.sh
      - name: Stage test-only package
        if: always() && matrix.scenario == 'fresh' && steps.build_test.outcome == 'success'
        run: |
          mkdir -p dist/tutorial-apk
          cp app/build/outputs/apk/release/app-release.apk dist/tutorial-apk/KaraDugum-6.52-115-TEST.apk
          (cd dist/tutorial-apk && sha256sum *.apk > SHA256SUMS)
          git rev-parse HEAD > dist/tutorial-apk/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always() && matrix.scenario == 'fresh' && steps.build_test.outcome == 'success'
        with:
          name: KaraDugum-6.52-115-TEST-APK
          path: dist/tutorial-apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KaraDugum-6.52-tutorial-${{ matrix.scenario }}-evidence
          path: dist/tutorial/
          if-no-files-found: ignore
