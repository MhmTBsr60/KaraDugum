name: KaraDugum energy finish signed TEST APK
on:
  push:
    branches: [design/energy-wave-metal-finish-test-20261119]
jobs:
  upgrade-test-apk:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      KD_ADS_MODE: test
      KD_TEST_VERSION: 6.50-energy-finish-test1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Game regressions and preserved TEST payload
        run: |
          npm test
          node tests/ux-protected-core.cjs
          python3 - <<'PY'
          import subprocess
          for name in ['index.html','localization.js','daily-treasure.js','daily-treasure.css','assets/daily-treasure-chest.webp']:
              assert not subprocess.check_output(['git','diff','0cb0a2f','HEAD','--',name]),name
          for name in ['connection-model.js','board-renderer.js','onboarding.js','cloud-model.js','cloud-sync.js','feedback.js','wheel.js','MainActivity.java','AndroidManifest.xml','admob-units.json','.github/workflows/android-apk.yml']:
              assert not subprocess.check_output(['git','diff','a723070','HEAD','--',name]),name
          PY
          node --check theme-renderer.js
          node --check pipe-flow.js
          node scripts/configure-ads.cjs app/kd-ads.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android projesini hazirla
        shell: bash
        run: |
          set -euo pipefail
          test -f MainActivity.java || { echo 'MainActivity.java eksik'; exit 1; }
          test -f index.html || { echo 'index.html eksik'; exit 1; }
          grep -q '^package com.orynexa.karadugum;' MainActivity.java || { echo 'HATA: MainActivity paket adi yanlis'; exit 1; }
          mkdir -p app/src/main/java/com/orynexa/karadugum app/src/main/assets app/src/main/res/drawable-nodpi
          cp MainActivity.java app/src/main/java/com/orynexa/karadugum/MainActivity.java
          cp TapLightOverlay.java app/src/main/java/com/orynexa/karadugum/TapLightOverlay.java
          cp TapLightOverlay.java app/src/main/java/com/orynexa/karadugum/TapLightOverlay.java
          cp UiFeedbackGate.java app/src/main/java/com/orynexa/karadugum/UiFeedbackGate.java
          cp HapticFeedbackPlayer.java app/src/main/java/com/orynexa/karadugum/HapticFeedbackPlayer.java
          cp GamesStartupActivity.java app/src/main/java/com/orynexa/karadugum/GamesStartupActivity.java
          cp NativeStrings.java app/src/main/java/com/orynexa/karadugum/NativeStrings.java
          cp AudiencePolicy.java app/src/main/java/com/orynexa/karadugum/AudiencePolicy.java
          cp AudienceChoiceStore.java app/src/main/java/com/orynexa/karadugum/AudienceChoiceStore.java
          cp AdConsentGate.java app/src/main/java/com/orynexa/karadugum/AdConsentGate.java
          cp InterstitialCadence.java app/src/main/java/com/orynexa/karadugum/InterstitialCadence.java
          cp AdLoadGate.java app/src/main/java/com/orynexa/karadugum/AdLoadGate.java
          cp CloudMerge.java app/src/main/java/com/orynexa/karadugum/CloudMerge.java
          cp InstallationIdentity.java app/src/main/java/com/orynexa/karadugum/InstallationIdentity.java
          cp index.html app/src/main/assets/index.html
          cp connection-model.js pipe-flow.js pipe-flow.css app/src/main/assets/
          cp daily-treasure.js daily-treasure.css app/src/main/assets/
          cp light-feedback.js light-feedback.css app/src/main/assets/
          cp mechanic-progress.js app/src/main/assets/mechanic-progress.js
          cp privacy-policy.html app/src/main/assets/privacy-policy.html
          cp delete-account.html app/src/main/assets/delete-account.html
          cp privacy-settings.js app/src/main/assets/privacy-settings.js
          cp wheel.js app/src/main/assets/wheel.js
          cp feedback.js app/src/main/assets/feedback.js
          cp light-feedback.js light-feedback.css app/src/main/assets/
          cp wheel-motion.js app/src/main/assets/wheel-motion.js
          cp ux-locales.js app/src/main/assets/ux-locales.js
          cp ux-polish.css ux-refinement.css app/src/main/assets/
          cp gameplay-ui.js app/src/main/assets/gameplay-ui.js
          cp gameplay-layout.css app/src/main/assets/gameplay-layout.css
          cp localization.js app/src/main/assets/localization.js
          cp screens.css app/src/main/assets/screens.css
          cp reference.css app/src/main/assets/reference.css
          cp theme-skins.css app/src/main/assets/theme-skins.css
          cp home-icons.css app/src/main/assets/home-icons.css
          cp modern-panels.css app/src/main/assets/modern-panels.css
          cp learning.css app/src/main/assets/learning.css
          cp daily-challenge.css app/src/main/assets/daily-challenge.css
          cp daily-challenge.js app/src/main/assets/daily-challenge.js
          cp save-health.js app/src/main/assets/save-health.js
          cp save-health.css app/src/main/assets/save-health.css
          cp onboarding.js app/src/main/assets/onboarding.js
          cp onboarding.css app/src/main/assets/onboarding.css
          cp workshop.js app/src/main/assets/workshop.js
          cp workshop.css app/src/main/assets/workshop.css
          cp xp-cosmetics.js app/src/main/assets/xp-cosmetics.js
          cp xp-cosmetics.css app/src/main/assets/xp-cosmetics.css
          cp board-focus.js app/src/main/assets/board-focus.js
          cp board-focus.css app/src/main/assets/board-focus.css
          cp mechanic-quests.js app/src/main/assets/mechanic-quests.js
          cp cloud-model.js app/src/main/assets/cloud-model.js
          cp cloud-sync.js app/src/main/assets/cloud-sync.js
          cp weekly-quests.js app/src/main/assets/weekly-quests.js
          cp learning.js app/src/main/assets/learning.js
          cp board-renderer.js app/src/main/assets/board-renderer.js
          cp obsidian-gold.css app/src/main/assets/obsidian-gold.css
          cp obsidian-gold.js app/src/main/assets/obsidian-gold.js
          cp reward-receipts.js app/src/main/assets/reward-receipts.js
          cp theme-renderer.js app/src/main/assets/theme-renderer.js
          mkdir -p app/src/main/assets/assets
          cp assets/kara-dugum-menu.png app/src/main/assets/assets/kara-dugum-menu.png
          cp assets/daily-treasure-chest.webp app/src/main/assets/assets/daily-treasure-chest.webp
          cp assets/kara-dugum-treasury.webp app/src/main/assets/assets/kara-dugum-treasury.webp
          cp assets/kara-dugum-reference.png app/src/main/assets/assets/kara-dugum-reference.png
          cp assets/kara-dugum-expansion.webp app/src/main/assets/assets/kara-dugum-expansion.webp
          cp assets/kara-dugum-theme-scenes.webp app/src/main/assets/assets/kara-dugum-theme-scenes.webp
          cp assets/kara-dugum-theme-stones.webp app/src/main/assets/assets/kara-dugum-theme-stones.webp
          cp assets/kara-dugum-home-icons.webp app/src/main/assets/assets/kara-dugum-home-icons.webp
          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          elif [ -f android-icons/mipmap-xxxhdpi/ic_launcher.png ]; then
            cp android-icons/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          elif [ -f android-icons/mipmap-mdpi/ic_launcher.png ]; then
            cp android-icons/mipmap-mdpi/ic_launcher.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          else
            echo 'HATA: icon.png veya android-icons simgesi bulunamadi.'
            exit 1
          fi
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          python3 - <<'PYTEST'
          from pathlib import Path
          p=Path('app/src/main/AndroidManifest.xml')
          text=p.read_text().replace('android:label="KARA DÜĞÜM"', 'android:label="KARA DÜĞÜM TEST"')
          p.write_text(text)
          PYTEST
          mkdir -p app/src/main/res/values
          printf '<resources><string name="game_services_project_id">1097423047801</string></resources>\n' > app/src/main/res/values/strings.xml
          mkdir -p app/src/androidTest/java/com/orynexa/karadugum
          cp tests/android/EnergyFinishUpgradeAudit.java app/src/androidTest/java/com/orynexa/karadugum/
          cp tests/android/AndroidManifest.xml app/src/androidTest/AndroidManifest.xml
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'KaraDugum'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.13.2' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }
          def ads = new groovy.json.JsonSlurper().parse(file('kd-ads.json'))
          android {
            buildFeatures { buildConfig true }
            testBuildType "release"
            namespace 'com.orynexa.karadugum'
            compileSdk 36
            defaultConfig {
              applicationId 'com.orynexa.karadugum'
              testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              minSdk 24
              targetSdk 36
              versionCode 110
              versionName '6.50-energy-finish-test1'
              buildConfigField 'boolean', 'ADS_TEST_MODE', String.valueOf(ads.mode == 'test')
              buildConfigField 'String', 'REWARDED_AD_UNIT_ID', groovy.json.JsonOutput.toJson(ads.rewardedUnitId)
              buildConfigField 'String', 'INTERSTITIAL_AD_UNIT_ID', groovy.json.JsonOutput.toJson(ads.interstitialUnitId)
            }
            signingConfigs {
              release {
                storeFile file('karadugum.jks')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          dependencies {
            androidTestImplementation 'androidx.test:runner:1.6.2'
            androidTestImplementation 'androidx.test:core:1.6.1'
            androidTestImplementation 'androidx.test.ext:junit:1.2.1'
          }
          apply from: rootProject.file('android-dependencies.gradle')
          EOF

      - name: Imzalama anahtarini hazirla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "HATA: $variable icin GitHub Secret eksik veya bos."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/karadugum.jks
          keytool -list -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}' > /tmp/expected-cert-sha256
          # Play Games Android OAuth credential must match the installed APK signing certificate.
          EXPECTED_PGS_SHA1='A1:65:1D:CD:D6:56:A9:3D:E4:5C:DC:8B:CC:F0:48:1C:4F:A1:22:4A'
          ACTUAL_PGS_SHA1=$(keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha1sum | awk '{print toupper($1)}' | sed 's/../&:/g;s/:$//')
          echo "Play Games OAuth SHA-1: $EXPECTED_PGS_SHA1"
          echo "APK signing SHA-1: $ACTUAL_PGS_SHA1"
          if [ "$ACTUAL_PGS_SHA1" != "$EXPECTED_PGS_SHA1" ]; then
            echo 'HATA: APK imza SHA-1 Play Games Android OAuth kimlik bilgisiyle eslesmiyor.'
            exit 1
          fi
          echo 'Imza sertifikasi hazir.'

      - name: Yalniz TEST APK derle ve lint calistir
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease :app:assembleReleaseAndroidTest

      - name: Imza ve TEST paketini dogrula
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-apk-signature.sh app/build/outputs/apk/release/app-release.apk /tmp/expected-cert-sha256
          python3 scripts/verify-test-apk.py app/build/outputs/apk/release/app-release.apk

      - name: Verify packaged treasure and previous signer
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 https://raw.githubusercontent.com/MhmTBsr60/KaraDugum/64e76b05446e63c968fd2316dae927baf84738bb/test-builds/treasure-energy-test1-20261119/KaraDugum-6.50-TREASURE-ENERGY-TEST1.apk -o "$RUNNER_TEMP/previous-test.apk"
          echo "b54c5a267f7d780dd6fb704f8ffaef91f64fe867306dde26f4d4b0328df91548  $RUNNER_TEMP/previous-test.apk" | sha256sum --check
          bash scripts/verify-apk-signature.sh "$RUNNER_TEMP/previous-test.apk" /tmp/expected-cert-sha256
          node tests/apk-tutorial-delivery-audit.cjs app/build/outputs/apk/release/app-release.apk
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              for name in ['daily-treasure.js','daily-treasure.css','assets/daily-treasure-chest.webp','ux-refinement.css']:
                  assert apk.read('assets/'+name)==Path(name).read_bytes(),name
          PY
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" sign --ks app/karadugum.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          sudo chmod 666 /dev/kvm
      - name: Install over previous signed TEST and compare persisted data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            mkdir -p dist/upgrade
            timeout 45s adb install -r "$RUNNER_TEMP/previous-test.apk"
            timeout 45s adb install -r app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            timeout 90s adb shell am instrument -w -e class 'com.orynexa.karadugum.EnergyFinishUpgradeAudit#seedPreviousSignedTest' com.orynexa.karadugum.test/androidx.test.runner.AndroidJUnitRunner > dist/upgrade/seed.log
            cat dist/upgrade/seed.log
            grep -F 'OK (1 test)' dist/upgrade/seed.log
            timeout 90s adb shell am instrument -w -e class 'com.orynexa.karadugum.EnergyFinishUpgradeAudit#verifyPreviousBeforeUpgrade' com.orynexa.karadugum.test/androidx.test.runner.AndroidJUnitRunner > dist/upgrade/restart.log
            cat dist/upgrade/restart.log
            grep -F 'OK (1 test)' dist/upgrade/restart.log
            adb shell am force-stop com.orynexa.karadugum
            timeout 45s adb install -r app/build/outputs/apk/release/app-release.apk
            timeout 100s adb shell am instrument -w -e class 'com.orynexa.karadugum.EnergyFinishUpgradeAudit#verifyAfterInPlaceInstall' com.orynexa.karadugum.test/androidx.test.runner.AndroidJUnitRunner > dist/upgrade/new.log
            cat dist/upgrade/new.log
            adb pull /sdcard/Android/data/com.orynexa.karadugum/files/webview-audit/. dist/upgrade/
            grep -F 'OK (1 test)' dist/upgrade/new.log
      - name: Stage only verified TEST APK
        run: |
          mkdir -p dist/test-apk
          cp app/build/outputs/apk/release/app-release.apk dist/test-apk/KaraDugum-6.50-ENERGY-FINISH-TEST1.apk
          cp dist/upgrade/upgrade-report.json dist/test-apk/
          cp app/build/outputs/apk/release/app-release.apk.tutorial-check.json dist/test-apk/
          cp /tmp/expected-cert-sha256 dist/test-apk/signer-sha256.txt
          (cd dist/test-apk && sha256sum *.apk > SHA256SUMS)
          git rev-parse HEAD > dist/test-apk/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: karadugum-energy-finish-signed-test1
          path: dist/test-apk/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-finish-upgrade-diagnostics
          path: dist/upgrade/
