name: KaraDugum Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ads_mode:
        description: 'both: test ve canli paket; test/live: yalniz secilen paket'
        type: choice
        options: [both, test, live]
        default: both
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      KD_ADS_MODE: ${{ inputs.ads_mode == 'live' && 'live' || 'test' }}
      ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Reklam modunu dogrula
        run: node scripts/configure-ads.cjs app/kd-ads.json

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Oyun JavaScript sozdizimini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      attrs = dict(attrs)
                      self.active = 'src' not in attrs and attrs.get('type', 'text/javascript') in ('text/javascript', 'module')
                      self.parts = []
              def handle_data(self, data):
                  if self.active:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script':
                      if self.active:
                          self.scripts.append(''.join(self.parts))
                      self.active = False
          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.scripts:
              raise SystemExit('HATA: Kontrol edilecek JavaScript bulunamadi')
          for i, script in enumerate(parser.scripts, 1):
              Path('/tmp/karadugum-script-%d.js' % i).write_text(script, encoding='utf-8')
          print('%d oyun scripti kontrol edilecek' % len(parser.scripts))
          PY
          for script in /tmp/karadugum-script-*.js; do node --check "$script"; done
          node --check wheel.js
          node --check localization.js
          node --check theme-renderer.js
          node --check board-renderer.js
          node --check reward-receipts.js
          node --check learning.js
          node --check daily-challenge.js
          node --check cloud-model.js
          node --check cloud-sync.js
          node --check weekly-quests.js
          node --check mechanic-progress.js
          node --check privacy-settings.js
          node --check scripts/configure-ads.cjs
          node --check scripts/stage-release.cjs
          node --check scripts/verify-sdk-dependencies.cjs
          bash -n scripts/verify-apk-signature.sh
          bash -n scripts/verify-aab-signature.sh
          bash -n scripts/inspect-release-manifests.sh

      - name: 300 bolum otomatik denetimi
        run: |
          node tests/level-audit.cjs
          node tests/hint-runtime-audit.cjs
          node tests/ui-regression.cjs
          node tests/full-solve-audit.cjs
          node tests/weekly-calendar-audit.cjs
          node tests/ad-config-audit.cjs
          node tests/sdk-dependencies-audit.cjs
          python3 tests/android-manifests-audit.py
          node tests/mechanic-progress-audit.cjs
          node tests/release-package-audit.cjs
          node tests/mechanic-quests-audit.cjs
          node tests/workshop-audit.cjs
          node tests/wheel-readiness-audit.cjs
          node tests/store-listing-audit.cjs

      - name: Java ve JavaScript bulut birlestirme kontrolu
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar --output "$RUNNER_TEMP/kd-json.jar"
          node tests/cloud-model-audit.cjs --fixtures "$RUNNER_TEMP/kd-cloud-fixtures.json"
          mkdir -p "$RUNNER_TEMP/kd-cloud-classes"
          javac -cp "$RUNNER_TEMP/kd-json.jar" -d "$RUNNER_TEMP/kd-cloud-classes" CloudMerge.java tests/CloudMergeAudit.java InstallationIdentity.java tests/InstallationIdentityAudit.java AdConsentGate.java tests/AdConsentGateAudit.java InterstitialCadence.java tests/InterstitialCadenceAudit.java AdLoadGate.java tests/AdLoadGateAudit.java NativeStrings.java tests/NativeStringsAudit.java AudiencePolicy.java tests/AudiencePolicyAudit.java
          java -cp "$RUNNER_TEMP/kd-cloud-classes:$RUNNER_TEMP/kd-json.jar" com.orynexa.karadugum.CloudMergeAudit "$RUNNER_TEMP/kd-cloud-fixtures.json"
          java -cp "$RUNNER_TEMP/kd-cloud-classes" com.orynexa.karadugum.InstallationIdentityAudit
          java -cp "$RUNNER_TEMP/kd-cloud-classes" com.orynexa.karadugum.AdConsentGateAudit
          java -cp "$RUNNER_TEMP/kd-cloud-classes" com.orynexa.karadugum.InterstitialCadenceAudit
          java -cp "$RUNNER_TEMP/kd-cloud-classes" com.orynexa.karadugum.AdLoadGateAudit
          java -cp "$RUNNER_TEMP/kd-cloud-classes" com.orynexa.karadugum.NativeStringsAudit
          java -cp "$RUNNER_TEMP/kd-cloud-classes" com.orynexa.karadugum.AudiencePolicyAudit

      - name: Gercek tarayici testlerini kur ve calistir
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Bolum ve kayit koruma kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/android-apk.yml').read_text(encoding='utf-8')
          required = [
              ("300 bolum", "Math.min(300"),
              ("Bulut kaydi", "window.kdCloudSync"),
              ("Cift odul korumasi", "function win(){if(locked)return;"),
              ("Sure bitimi", "window.kdLastWin=null;clearInterval(timer);"),
              ("Tekrar dene", "if(replay || !window.kdLastWin)"),
              ("Bolum boyutlari", "n=level<=15?4:level<=30?5:level<=75?6:level<=150?7:8;"),
          ]
          for label, token in required:
              if token not in html:
                  raise SystemExit('HATA: ' + label + ' kontrolu basarisiz')
          if 'id="backup"' in html:
              raise SystemExit('HATA: Eski yedekleme butonu yeniden eklenmis')
          if "versionCode 105" not in workflow or "versionName '6.45'" not in workflow:
              raise SystemExit('HATA: Surum 6.45 ayarlari uyusmuyor')
          java = Path('MainActivity.java').read_text(encoding='utf-8')
          if 'registerOnBackInvokedCallback' not in java or 'window.kdHandleBack' not in java:
              raise SystemExit('HATA: Android geri hareketi kontrolu eksik')
          print('Bolum, kayit, odul, geri hareketi ve surum kontrolleri gecti.')
          PY

      - name: Android projesini hazirla
        shell: bash
        run: |
          set -euo pipefail
          test -f MainActivity.java || { echo 'MainActivity.java eksik'; exit 1; }
          test -f index.html || { echo 'index.html eksik'; exit 1; }
          grep -q '^package com.orynexa.karadugum;' MainActivity.java || { echo 'HATA: MainActivity paket adi yanlis'; exit 1; }
          mkdir -p app/src/main/java/com/orynexa/karadugum app/src/main/assets app/src/main/res/drawable-nodpi
          cp MainActivity.java app/src/main/java/com/orynexa/karadugum/MainActivity.java
          cp NativeStrings.java app/src/main/java/com/orynexa/karadugum/NativeStrings.java
          cp AudiencePolicy.java app/src/main/java/com/orynexa/karadugum/AudiencePolicy.java
          cp AdConsentGate.java app/src/main/java/com/orynexa/karadugum/AdConsentGate.java
          cp InterstitialCadence.java app/src/main/java/com/orynexa/karadugum/InterstitialCadence.java
          cp AdLoadGate.java app/src/main/java/com/orynexa/karadugum/AdLoadGate.java
          cp CloudMerge.java app/src/main/java/com/orynexa/karadugum/CloudMerge.java
          cp InstallationIdentity.java app/src/main/java/com/orynexa/karadugum/InstallationIdentity.java
          cp index.html app/src/main/assets/index.html
          cp mechanic-progress.js app/src/main/assets/mechanic-progress.js
          cp privacy-policy.html app/src/main/assets/privacy-policy.html
          cp delete-account.html app/src/main/assets/delete-account.html
          cp privacy-settings.js app/src/main/assets/privacy-settings.js
          cp wheel.js app/src/main/assets/wheel.js
          cp localization.js app/src/main/assets/localization.js
          cp screens.css app/src/main/assets/screens.css
          cp reference.css app/src/main/assets/reference.css
          cp theme-skins.css app/src/main/assets/theme-skins.css
          cp home-icons.css app/src/main/assets/home-icons.css
          cp modern-panels.css app/src/main/assets/modern-panels.css
          cp learning.css app/src/main/assets/learning.css
          cp daily-challenge.css app/src/main/assets/daily-challenge.css
          cp daily-challenge.js app/src/main/assets/daily-challenge.js
          cp save-health.js app/src/main/assets/save-health.js
          cp save-health.css app/src/main/assets/save-health.css
          cp onboarding.js app/src/main/assets/onboarding.js
          cp onboarding.css app/src/main/assets/onboarding.css
          cp workshop.js app/src/main/assets/workshop.js
          cp workshop.css app/src/main/assets/workshop.css
          cp xp-cosmetics.js app/src/main/assets/xp-cosmetics.js
          cp xp-cosmetics.css app/src/main/assets/xp-cosmetics.css
          cp board-focus.js app/src/main/assets/board-focus.js
          cp board-focus.css app/src/main/assets/board-focus.css
          cp mechanic-quests.js app/src/main/assets/mechanic-quests.js
          cp cloud-model.js app/src/main/assets/cloud-model.js
          cp cloud-sync.js app/src/main/assets/cloud-sync.js
          cp weekly-quests.js app/src/main/assets/weekly-quests.js
          cp learning.js app/src/main/assets/learning.js
          cp board-renderer.js app/src/main/assets/board-renderer.js
          cp reward-receipts.js app/src/main/assets/reward-receipts.js
          cp theme-renderer.js app/src/main/assets/theme-renderer.js
          mkdir -p app/src/main/assets/assets
          cp assets/kara-dugum-menu.png app/src/main/assets/assets/kara-dugum-menu.png
          cp assets/kara-dugum-treasury.webp app/src/main/assets/assets/kara-dugum-treasury.webp
          cp assets/kara-dugum-reference.png app/src/main/assets/assets/kara-dugum-reference.png
          cp assets/kara-dugum-expansion.webp app/src/main/assets/assets/kara-dugum-expansion.webp
          cp assets/kara-dugum-theme-scenes.webp app/src/main/assets/assets/kara-dugum-theme-scenes.webp
          cp assets/kara-dugum-theme-stones.webp app/src/main/assets/assets/kara-dugum-theme-stones.webp
          cp assets/kara-dugum-home-icons.webp app/src/main/assets/assets/kara-dugum-home-icons.webp
          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          elif [ -f android-icons/mipmap-xxxhdpi/ic_launcher.png ]; then
            cp android-icons/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          elif [ -f android-icons/mipmap-mdpi/ic_launcher.png ]; then
            cp android-icons/mipmap-mdpi/ic_launcher.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          else
            echo 'HATA: icon.png veya android-icons simgesi bulunamadi.'
            exit 1
          fi
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          mkdir -p app/src/main/res/values
          printf '<resources><string name="game_services_project_id">1097423047801</string></resources>\n' > app/src/main/res/values/strings.xml
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'KaraDugum'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.13.2' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }
          def ads = new groovy.json.JsonSlurper().parse(file('kd-ads.json'))
          android {
            buildFeatures { buildConfig true }
            namespace 'com.orynexa.karadugum'
            compileSdk 36
            defaultConfig {
              applicationId 'com.orynexa.karadugum'
              minSdk 24
              targetSdk 36
              versionCode 105
              versionName '6.45'
              buildConfigField 'boolean', 'ADS_TEST_MODE', String.valueOf(ads.mode == 'test')
              buildConfigField 'String', 'REWARDED_AD_UNIT_ID', groovy.json.JsonOutput.toJson(ads.rewardedUnitId)
              buildConfigField 'String', 'INTERSTITIAL_AD_UNIT_ID', groovy.json.JsonOutput.toJson(ads.interstitialUnitId)
            }
            signingConfigs {
              release {
                storeFile file('karadugum.jks')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          apply from: rootProject.file('android-dependencies.gradle')
          EOF

      - name: AAB manifest denetim aracini dogrula
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/kd-bundletool.jar"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          jar = Path(os.environ['RUNNER_TEMP']) / 'kd-bundletool.jar'
          if hashlib.sha256(jar.read_bytes()).hexdigest() != 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29':
              raise SystemExit('Official bundletool checksum mismatch')
          print('Verified official bundletool 1.18.3')
          PY

      - name: Cozumlenen Android SDK bagimliliklarini denetle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/sdk
          gradle --no-daemon --console=plain :app:dependencies --configuration releaseRuntimeClasspath > build/reports/sdk/release-runtime-dependencies.txt
          gradle --no-daemon --console=plain :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency androidx.fragment:fragment > build/reports/sdk/fragment-insight.txt
          gradle --no-daemon --console=plain :app:exportReleaseSdkDependencies :app:checkReleaseAarMetadata
          node scripts/verify-sdk-dependencies.cjs build/reports/sdk/release-sdk-dependencies.json

      - name: Android SDK bagimlilik raporlarini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v6.45-SDK-REPORTS
          path: build/reports/sdk/*
          if-no-files-found: ignore
          retention-days: 30

      - name: Imzalama anahtarini hazirla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "HATA: $variable icin GitHub Secret eksik veya bos."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/karadugum.jks
          keytool -list -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}' > /tmp/expected-cert-sha256
          # Play Games Android OAuth credential must match the installed APK signing certificate.
          EXPECTED_PGS_SHA1='A1:65:1D:CD:D6:56:A9:3D:E4:5C:DC:8B:CC:F0:48:1C:4F:A1:22:4A'
          ACTUAL_PGS_SHA1=$(keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha1sum | awk '{print toupper($1)}' | sed 's/../&:/g;s/:$//')
          echo "Play Games OAuth SHA-1: $EXPECTED_PGS_SHA1"
          echo "APK signing SHA-1: $ACTUAL_PGS_SHA1"
          if [ "$ACTUAL_PGS_SHA1" != "$EXPECTED_PGS_SHA1" ]; then
            echo 'HATA: APK imza SHA-1 Play Games Android OAuth kimlik bilgisiyle eslesmiyor.'
            exit 1
          fi
          echo 'Imza sertifikasi hazir.'

      - name: APK ve AAB derle
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease :app:lintRelease

      - name: APK imzasini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-apk-signature.sh app/build/outputs/apk/release/app-release.apk /tmp/expected-cert-sha256
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess, zipfile
          sdk = Path(os.environ['ANDROID_HOME'])
          aapt = sorted(sdk.glob('build-tools/*/aapt2'))[-1]
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          info = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          for token in ["name='com.orynexa.karadugum'", "versionCode='105'", "versionName='6.45'", "targetSdkVersion:'36'", "uses-permission: name='com.google.android.gms.permission.AD_ID'"]:
              if token not in info:
                  raise SystemExit('APK manifest mismatch: ' + token)
          if not re.search(r"^(?:minSdkVersion|sdkVersion):'24'$", info, re.M):
              raise SystemExit('APK minimum API must remain 24')
          with zipfile.ZipFile(apk) as archive:
              for name in ['index.html', 'board-focus.css', 'theme-skins.css', 'cloud-model.js', 'cloud-sync.js', 'reward-receipts.js']:
                  if archive.read('assets/' + name) != Path(name).read_bytes():
                      raise SystemExit('APK asset mismatch: ' + name)
          print('PASS: actual APK package/version/API/AD_ID and gameplay/save assets')
          PY

      - name: AAB imzasini kontrol et
        run: bash scripts/verify-aab-signature.sh app/build/outputs/bundle/release/app-release.aab /tmp/expected-cert-sha256

      - name: Birlesmis ve paketlenmis AAB manifestlerini dogrula
        run: bash scripts/inspect-release-manifests.sh "${{ env.KD_ADS_MODE }}" 6.45 105 "$RUNNER_TEMP/kd-bundletool.jar"

      - name: Paketin surum ve reklam modunu dogrula
        run: |
          node scripts/stage-release.cjs 6.45 105
          cp build/reports/sdk/release-sdk-dependencies.json dist/${{ env.KD_ADS_MODE }}/KaraDugum-v6.45-${{ env.KD_ADS_MODE == 'live' && 'LIVE' || 'TEST' }}-sdk-dependencies.json
          cp build/reports/manifests/${{ env.KD_ADS_MODE }}/* dist/${{ env.KD_ADS_MODE }}/

      - name: APK ve AAB dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v6.45-${{ env.KD_ADS_MODE == 'live' && 'LIVE' || 'TEST' }}-APK-AAB
          path: dist/${{ env.KD_ADS_MODE }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Canli reklamli APK ve AAB derle
        if: ${{ github.event_name == 'push' || inputs.ads_mode == 'both' }}
        shell: bash
        env:
          KD_ADS_MODE: live
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/configure-ads.cjs app/kd-ads.json
          gradle --no-daemon --stacktrace :app:clean :app:assembleRelease :app:bundleRelease
          bash scripts/verify-apk-signature.sh app/build/outputs/apk/release/app-release.apk /tmp/expected-cert-sha256
          bash scripts/verify-aab-signature.sh app/build/outputs/bundle/release/app-release.aab /tmp/expected-cert-sha256
          bash scripts/inspect-release-manifests.sh live 6.45 105 "$RUNNER_TEMP/kd-bundletool.jar"
          node scripts/stage-release.cjs 6.45 105
          cp build/reports/sdk/release-sdk-dependencies.json dist/live/KaraDugum-v6.45-LIVE-sdk-dependencies.json
          cp build/reports/manifests/live/* dist/live/

      - name: Canli APK ve AAB dosyalarini yukle
        if: ${{ github.event_name == 'push' || inputs.ads_mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v6.45-LIVE-APK-AAB
          path: dist/live/*
          if-no-files-found: error
          retention-days: 30

      - name: Android manifest raporlarini sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v6.45-MANIFEST-REPORTS
          path: build/reports/manifests/**/*
          if-no-files-found: ignore
          retention-days: 30
