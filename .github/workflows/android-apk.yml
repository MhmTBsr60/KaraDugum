      - name: APK imzasini dogrula
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          APKSIGNER=$(find "$SDK/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/cert.txt

          ACTUAL=$(grep -i 'certificate SHA-256 digest:' /tmp/cert.txt \
            | head -n 1 \
            | sed 's/.*digest: //' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          EXPECTED=$(printf '%s' "$EXPECTED_SHA256" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "HATA: APK sertifikasi mevcut imza anahtariyla eslesmiyor."
            exit 1
          fi

          echo "APK imzasi basariyla dogrulandi."
