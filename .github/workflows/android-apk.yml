name: KaraDugum Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak dosyalarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini hazirla
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/karadugum/puzzle
          mkdir -p app/src/main/assets

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/karadugum/puzzle/MainActivity.java
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'KaraDugum'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.karadugum.puzzle'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.karadugum.puzzle'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

      - name: APK olustur
        run: gradle --no-daemon :app:assembleDebug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
