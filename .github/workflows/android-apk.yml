Adı: KaraDugum Android APK
Açık:
  itmek:
    dallar: [ana, master]
  iş akışı_dağıtımı:
İşler:
  inşa etmek:
    name: KaraDugum v4 APK Olustur
    runs-on: ubuntu-latest
    İzinler:
      İçindekiler: oku
    Adımlar:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        ile:
          dağıtım: temurin
          Java sürümü: '17'
      - uses: gradle/actions/setup-gradle@v4
        ile:
          gradle-sürümü: '8.9'
      - isim: Android projesini hazırla
        kabuk: bash
        çalıştır: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/karadugum/puzzle app/src/main/assets
          cp MainActivity.java app/src/main/Java/com/karadugum/puzzle/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp google-services.json app/google-services.json
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <application android:label="KARA DÃœÄžÃœM" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <niyet-filtresi>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </aktivite>
            </uygulama>
          </manifest>
          MANİFEST
          kedi > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          bağımlılıkÇözümlemeYönetimi {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            depolar { google(); mavenCentral() }
          }
          rootProject.name = 'KaraDugum'
          ':app'i dahil et
          GRADLE
          kedi > build.gradle <<'GRADLE'
          eklentiler {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          GRADLE
          kedi > uygulama/yapılandırma.gradle <<'GRADLE'
          eklentiler {
            id 'com.android.application'
            id 'com.google.gms.google-services'
          }
          Android {
            ad alanı 'com.karadugum.puzzle'
            compileSdk 35
            varsayılan yapılandırma {
              uygulama kimliği 'com.karadugum.puzzle'
              minSdk 23
              targetSdk 28
              sürüm kodu 4
              sürüm adı '4.0'
            }
          }
          bağımlılıklar {
            uygulama platformu('com.google.firebase:firebase-bom:33.7.0')
            'com.google.firebase:firebase-auth' uygulamasının
            'com.google.firebase:firebase-database' uygulamasının
            'com.google.android.gms:play-services-auth:21.3.0' uygulamasının kurulumu
          }
          GRADLE
      - isim: APK olustur
        Çalıştır: gradle --no-daemon --stacktrace :app:assembleDebug
      - isim: APK SHA-1 sertifikasını goster
        kabuk: bash
        çalıştır: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        ile:
          adı: KaraDugum-v4-APK
          yol: app/build/outputs/apk/debug/app-debug.apk
          Dosya bulunamadıysa: hata
          saklama süresi: 30 gün
