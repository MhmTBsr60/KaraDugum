name: KaraDugum Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: KaraDugum v6.4 APK Olustur
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Kaynak kodlarini indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini hazirla
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/karadugum/puzzle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res

          cp MainActivity.java \
            app/src/main/java/com/karadugum/puzzle/MainActivity.java

          cp index.html app/src/main/assets/index.html

          if [ -d android-icons ]; then
            cp -R android-icons/. app/src/main/res/
          else
            echo "HATA: android-icons klasoru bulunamadi."
            exit 1
          fi

          if [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
          else
            echo "HATA: google-services.json bulunamadi."
            exit 1
          fi

          if [ ! -f app/src/main/res/mipmap-mdpi/ic_launcher.png ]; then
  echo "Android simgesi mipmap-mdpi klasorunde bulunamadi."
  echo "Mevcut simge dosyalari:"
  find app/src/main/res -type f | sort
fi

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />

            <application
                android:label="KARA DÜĞÜM"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.Material.NoActionBar"
                android:usesCleartextTraffic="false"
                android:allowBackup="true">

              <activity
                  android:name=".MainActivity"
                  android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name = 'KaraDugum'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
          }

          android {
            namespace 'com.karadugum.puzzle'
            compileSdk 35

            defaultConfig {
              applicationId 'com.karadugum.puzzle'
              minSdk 23
              targetSdk 35
              versionCode 64
              versionName '6.4'
            }

            signingConfigs {
              release {
                storeFile file('karadugum.jks')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }

            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }

          dependencies {
            implementation platform('com.google.firebase:firebase-bom:33.7.0')
            implementation 'com.google.firebase:firebase-auth'
            implementation 'com.google.firebase:firebase-database'
            implementation 'com.google.android.gms:play-services-auth:21.3.0'
          }
          EOF

      - name: Kalici imza anahtarini dogrula
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_B64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "HATA: Imzalama bilgilerinden biri eksik."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 -d > app/karadugum.jks

          keytool -list \
            -keystore app/karadugum.jks \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" > /dev/null

          echo "Imza anahtari basariyla dogrulandi."

          CERT_SHA256=$(keytool -exportcert \
            -keystore app/karadugum.jks \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" \
            | sha256sum | awk '{print $1}')

          echo "Beklenen sertifika SHA256: $CERT_SHA256"
          echo "EXPECTED_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: APK ve AAB olustur
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            :app:assembleRelease \
            :app:bundleRelease

      - name: APK imzasini dogrula
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "HATA: APK dosyasi olusturulamadi."
            exit 1
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          APKSIGNER=$(find "$SDK/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "HATA: apksigner bulunamadi."
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK" \
            | tee /tmp/cert.txt

          ACTUAL=$(sed -n \
            's/^Signer #1 certificate SHA-256 digest: //p' \
            /tmp/cert.txt | head -n 1 \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          EXPECTED=$(printf '%s' "$EXPECTED_SHA256" \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')

          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "HATA: APK sertifikasi imza anahtariyla eslesmiyor."
            exit 1
          fi

          echo "APK imzasi basariyla dogrulandi."

      - name: APK ve AAB dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v6.4-HD-APK-ve-AAB
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
