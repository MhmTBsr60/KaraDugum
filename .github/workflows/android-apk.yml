name: KaraDugum APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Kaynak kodlarini al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini hazirla
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/karadugum/puzzle
          mkdir -p app/src/main/assets

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/karadugum/puzzle/MainActivity.java
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'KaraDugum'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          API=35

          if [ ! -d "$SDK/platforms/android-35" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.karadugum.puzzle'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.karadugum.puzzle'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: APK olustur
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
