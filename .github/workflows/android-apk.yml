name: KaraDugum Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Oyun JavaScript sozdizimini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      attrs = dict(attrs)
                      self.active = 'src' not in attrs and attrs.get('type', 'text/javascript') in ('text/javascript', 'module')
                      self.parts = []
              def handle_data(self, data):
                  if self.active:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script':
                      if self.active:
                          self.scripts.append(''.join(self.parts))
                      self.active = False
          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          if not parser.scripts:
              raise SystemExit('HATA: Kontrol edilecek JavaScript bulunamadi')
          for i, script in enumerate(parser.scripts, 1):
              Path('/tmp/karadugum-script-%d.js' % i).write_text(script, encoding='utf-8')
          print('%d oyun scripti kontrol edilecek' % len(parser.scripts))
          PY
          for script in /tmp/karadugum-script-*.js; do node --check "$script"; done

      - name: 300 bolum otomatik denetimi
        run: node tests/level-audit.cjs

      - name: Bolum ve kayit koruma kontrolleri
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/android-apk.yml').read_text(encoding='utf-8')
          required = [
              ("300 bolum", "Math.min(300"),
              ("Bulut kaydi", "window.kdCloudSync"),
              ("Cift odul korumasi", "function win(){if(locked)return;"),
              ("Sure bitimi", "window.kdLastWin=null;clearInterval(timer);"),
              ("Tekrar dene", "if(replay || !window.kdLastWin)"),
              ("Bolum boyutlari", "n=level<=15?4:level<=30?5:level<=75?6:level<=150?7:8;"),
          ]
          for label, token in required:
              if token not in html:
                  raise SystemExit('HATA: ' + label + ' kontrolu basarisiz')
          if 'id="backup"' in html:
              raise SystemExit('HATA: Eski yedekleme butonu yeniden eklenmis')
          if "versionCode 68" not in workflow or "versionName '6.8'" not in workflow:
              raise SystemExit('HATA: Surum 6.8 ayarlari uyusmuyor')
          java = Path('MainActivity.java').read_text(encoding='utf-8')
          if 'registerOnBackInvokedCallback' not in java or 'window.kdHandleBack' not in java:
              raise SystemExit('HATA: Android geri hareketi kontrolu eksik')
          print('Bolum, kayit, odul, geri hareketi ve surum kontrolleri gecti.')
          PY

      - name: Android projesini hazirla
        shell: bash
        run: |
          set -euo pipefail
          test -f MainActivity.java || { echo 'MainActivity.java eksik'; exit 1; }
          test -f index.html || { echo 'index.html eksik'; exit 1; }
          test -f google-services.json || { echo 'google-services.json eksik'; exit 1; }
          grep -q '^package com.orynexa.karadugum;' MainActivity.java || { echo 'HATA: MainActivity paket adi yanlis'; exit 1; }
          grep -q '"package_name": "com.orynexa.karadugum"' google-services.json || { echo 'HATA: Firebase paket adi yanlis'; exit 1; }
          mkdir -p app/src/main/java/com/orynexa/karadugum app/src/main/assets app/src/main/res/drawable-nodpi
          cp MainActivity.java app/src/main/java/com/orynexa/karadugum/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp google-services.json app/google-services.json
          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          elif [ -f android-icons/mipmap-xxxhdpi/ic_launcher.png ]; then
            cp android-icons/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          elif [ -f android-icons/mipmap-mdpi/ic_launcher.png ]; then
            cp android-icons/mipmap-mdpi/ic_launcher.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          else
            echo 'HATA: icon.png veya android-icons simgesi bulunamadi.'
            exit 1
          fi
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <application android:label="KARA DÜĞÜM" android:icon="@drawable/karadugum_icon" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'KaraDugum'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
          }
          android {
            namespace 'com.orynexa.karadugum'
            compileSdk 36
            defaultConfig {
              applicationId 'com.orynexa.karadugum'
              minSdk 24
              targetSdk 36
              versionCode 68
              versionName '6.8'
            }
            signingConfigs {
              release {
                storeFile file('karadugum.jks')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation platform('com.google.firebase:firebase-bom:33.7.0')
            implementation 'com.google.firebase:firebase-auth'
            implementation 'com.google.firebase:firebase-database'
            implementation 'com.google.android.gms:play-services-auth:21.3.0'
          }
          EOF

      - name: Imzalama anahtarini hazirla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "HATA: $variable icin GitHub Secret eksik veya bos."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/karadugum.jks
          keytool -list -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}' > /tmp/expected-cert-sha256
          # Play Games Android OAuth credential must match the installed APK signing certificate.
          EXPECTED_PGS_SHA1='A1:65:1D:CD:D6:56:A9:3D:E4:5C:DC:8B:CC:F0:48:1C:4F:A1:22:4A'
          ACTUAL_PGS_SHA1=$(keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha1sum | awk '{print toupper($1)}' | sed 's/../&:/g;s/:$//')
          echo "Play Games OAuth SHA-1: $EXPECTED_PGS_SHA1"
          echo "APK signing SHA-1: $ACTUAL_PGS_SHA1"
          if [ "$ACTUAL_PGS_SHA1" != "$EXPECTED_PGS_SHA1" ]; then
            echo 'HATA: APK imza SHA-1 Play Games Android OAuth kimlik bilgisiyle eslesmiyor.'
            exit 1
          fi
          echo 'Imza sertifikasi hazir.'

      - name: APK ve AAB derle
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: APK imzasini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-cert.txt
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' /tmp/apk-cert.txt | head -n 1 | sed 's/.*digest: //' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(cat /tmp/expected-cert-sha256)
          echo "APK sertifikasi: $ACTUAL"
          echo "Anahtar sertifikasi: $EXPECTED"
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED" || { echo 'HATA: APK sertifikasi imza anahtariyla eslesmiyor.'; exit 1; }
          echo 'APK imzasi dogrulandi.'

      - name: APK ve AAB dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v6.8-APK-AAB
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
