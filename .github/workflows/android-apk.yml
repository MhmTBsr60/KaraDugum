name: KaraDugum Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Kaynaklari al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android projesini hazirla
        shell: bash
        run: |
          set -euo pipefail
          test -f MainActivity.java || { echo 'MainActivity.java eksik'; exit 1; }
          test -f index.html || { echo 'index.html eksik'; exit 1; }
          test -f google-services.json || { echo 'google-services.json eksik'; exit 1; }
          grep -q '^package com.orynexa.karadugum;' MainActivity.java || { echo 'HATA: MainActivity paket adi yanlis'; exit 1; }
          grep -q '"package_name": "com.orynexa.karadugum"' google-services.json || { echo 'HATA: Firebase paket adi yanlis'; exit 1; }
          mkdir -p app/src/main/java/com/orynexa/karadugum app/src/main/assets app/src/main/res/drawable-nodpi
          cp MainActivity.java app/src/main/java/com/orynexa/karadugum/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp google-services.json app/google-services.json
          if [ -f icon.png ]; then
            cp icon.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          elif [ -f android-icons/mipmap-xxxhdpi/ic_launcher.png ]; then
            cp android-icons/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          elif [ -f android-icons/mipmap-mdpi/ic_launcher.png ]; then
            cp android-icons/mipmap-mdpi/ic_launcher.png app/src/main/res/drawable-nodpi/karadugum_icon.png
          else
            echo 'HATA: icon.png veya android-icons simgesi bulunamadi.'
            exit 1
          fi
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.VIBRATE" />
            <application android:label="KARA DÜĞÜM" android:icon="@drawable/karadugum_icon" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'KaraDugum'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
            id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
            id 'com.google.gms.google-services'
          }
          android {
            namespace 'com.orynexa.karadugum'
            compileSdk 35
            defaultConfig {
              applicationId 'com.orynexa.karadugum'
              minSdk 24
              targetSdk 35
              versionCode 65
              versionName '6.5'
            }
            signingConfigs {
              release {
                storeFile file('karadugum.jks')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
              }
            }
          }
          dependencies {
            implementation platform('com.google.firebase:firebase-bom:33.7.0')
            implementation 'com.google.firebase:firebase-auth'
            implementation 'com.google.firebase:firebase-database'
            implementation 'com.google.android.gms:play-services-auth:21.3.0'
          }
          EOF

      - name: Imzalama anahtarini hazirla
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "HATA: $variable icin GitHub Secret eksik veya bos."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/karadugum.jks
          keytool -list -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}' > /tmp/expected-cert-sha256
          echo 'Imza sertifikasi hazir.'

      - name: APK ve AAB derle
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: APK imzasini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-cert.txt
          ACTUAL=$(grep -i 'certificate SHA-256 digest:' /tmp/apk-cert.txt | head -n 1 | sed 's/.*digest: //' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(cat /tmp/expected-cert-sha256)
          echo "APK sertifikasi: $ACTUAL"
          echo "Anahtar sertifikasi: $EXPECTED"
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED" || { echo 'HATA: APK sertifikasi imza anahtariyla eslesmiyor.'; exit 1; }
          echo 'APK imzasi dogrulandi.'

      - name: APK ve AAB dosyalarini yukle
        uses: actions/upload-artifact@v4
        with:
          name: KaraDugum-v6.5-APK-AAB
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
