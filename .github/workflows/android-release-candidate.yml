name: KaraDugum 6.51 signed release-candidate verification
on:
  push:
    branches: [release/candidate-6.51-20261120]
  workflow_dispatch:
jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/release/candidate-6.51-20261120' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [test, live]
    env:
      KD_ADS_MODE: ${{ matrix.mode }}
      KD_VERSION_NAME: ${{ matrix.mode == 'test' && '6.51-rc1-test' || '6.51' }}
      KD_VERSION_CODE: '111'
      KD_TEST_VERSION: 6.51-rc1-test
      KD_EXPECTED_SIGNER: 351b49b72bfc09ebb317769832319eadca9ded6dae709daeb8314719a53dee9e
      ADMOB_REWARDED_AD_UNIT_ID: ${{ vars.ADMOB_REWARDED_AD_UNIT_ID }}
      ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ vars.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare matching Android game assets and version
        run: |
          node tests/ux-protected-core.cjs
          bash scripts/prepare-android-rc.sh
      - name: Verify keystore fingerprint against production 6.50 and signed TEST3
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/karadugum.jks
          keytool -exportcert -keystore app/karadugum.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" |
            sha256sum | awk '{print $1}' > "$RUNNER_TEMP/expected-cert-sha256"
          test "$(cat "$RUNNER_TEMP/expected-cert-sha256")" = "$KD_EXPECTED_SIGNER"
      - name: Build signed TEST APK and run Android lint
        if: matrix.mode == 'test'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease :app:assembleReleaseAndroidTest
      - name: Verify TEST APK source assets, Google sample ads and upgrade signer
        if: matrix.mode == 'test'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist/upgrade
          apk=app/build/outputs/apk/release/app-release.apk
          cp test-builds/poco-energy-test3-20261120/KaraDugum-6.50-POCO-ENERGY-TEST3.apk "$RUNNER_TEMP/previous-test.apk"
          echo "852eaf4a0bef56773b00bf254e9b589aebc47fc67cb79d998c565a139f27da99  $RUNNER_TEMP/previous-test.apk" | sha256sum --check
          for package in "$apk" "$RUNNER_TEMP/previous-test.apk"; do
            bash scripts/verify-apk-signature.sh "$package" "$RUNNER_TEMP/expected-cert-sha256"
          done
          python3 scripts/verify-test-apk.py "$apk"
          python3 scripts/verify-rc-assets.py --package "$apk" --report dist/upgrade/test-assets.json
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" sign --ks app/karadugum.jks --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          sudo chmod 666 /dev/kvm
      - name: Install over signed TEST3 and exercise the running Android WebView
        if: matrix.mode == 'test'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2 -skin 720x1600 -dpi-device 320
          script: bash scripts/run-rc-upgrade-audit.sh
      - name: Stage verified TEST APK and evidence
        if: matrix.mode == 'test'
        run: |
          mkdir -p dist/test-apk
          cp app/build/outputs/apk/release/app-release.apk dist/test-apk/KaraDugum-6.51-RC1-TEST.apk
          cp dist/upgrade/{upgrade-report,candidate-webview-report,test-assets}.json dist/test-apk/
          cp "$RUNNER_TEMP/expected-cert-sha256" dist/test-apk/signer-sha256.txt
          (cd dist/test-apk && sha256sum *.apk > SHA256SUMS)
          git rev-parse HEAD > dist/test-apk/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'test'
        with:
          name: KaraDugum-6.51-RC1-signed-TEST
          path: dist/test-apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.mode == 'test'
        with:
          name: KaraDugum-6.51-RC1-emulator
          path: dist/upgrade/
      - name: Build production-mode candidate AAB and lint for readiness
        if: matrix.mode == 'live'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:bundleRelease :app:lintRelease :app:exportReleaseSdkDependencies :app:checkReleaseAarMetadata
      - name: Verify production-mode manifest, upload certificate and content
        if: matrix.mode == 'live'
        run: |
          set -euo pipefail
          out=dist/aab-readiness
          mkdir -p "$out"
          bundletool="$RUNNER_TEMP/kd-bundletool.jar"
          curl --fail --silent --show-error --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$bundletool"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum --check
          aab=app/build/outputs/bundle/release/app-release.aab
          bash scripts/inspect-release-manifests.sh live "$KD_VERSION_NAME" "$KD_VERSION_CODE" "$bundletool"
          jarsigner -verify "$aab" > "$out/jarsigner.txt"
          grep -F 'jar verified.' "$out/jarsigner.txt"
          keytool -printcert -jarfile "$aab" | awk '/SHA256:/{print tolower($2)}' | tr -d ':' > "$out/signer-sha256.txt"
          test "$(cat "$out/signer-sha256.txt")" = "$KD_EXPECTED_SIGNER"
          python3 scripts/verify-rc-assets.py --package "$aab" --report "$out/aab-assets.json"
          node scripts/verify-sdk-dependencies.cjs build/reports/sdk/release-sdk-dependencies.json "$KD_VERSION_NAME" "$KD_VERSION_CODE"
          cp build/reports/manifests/live/{manifest-verification.json,bundle-manifest.xml,bundle-validation.txt} "$out/"
          cp build/reports/sdk/release-sdk-dependencies.json "$out/"
          git rev-parse HEAD > "$out/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'live'
        with:
          name: KaraDugum-6.51-AAB-readiness-report
          path: dist/aab-readiness/
          if-no-files-found: error
