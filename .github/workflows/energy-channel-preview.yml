name: Broad channel reference 3 source preview - no game APK build
on:
  push:
    branches: [design/energy-wave-channel-preview-20261119]
  workflow_dispatch:
jobs:
  webview-source-preview:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protected core and preview syntax
        run: |
          node tests/ux-protected-core.cjs
          node --check pipe-flow.js
          npm ci --ignore-scripts
      - name: Serve preview source only - no APK build or download
        run: |
          nohup python3 -m http.server 8765 --bind 0.0.0.0 > /tmp/kd-http.log 2>&1 &
          sudo chmod 666 /dev/kvm
      - name: Render real engine in Android 35 system WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 180
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 1536 -cores 2 -skin 720x1600 -dpi-device 320
          script: |
            adb shell pm path org.chromium.webview_shell
            adb shell wm density 320
            adb reverse tcp:8765 tcp:8765
            adb shell am start -a android.intent.action.VIEW -d http://127.0.0.1:8765/index.html -n org.chromium.webview_shell/.WebViewBrowserActivity
            mkdir -p dist/energy-channel-webview
            sleep 3
            KD_WAVE_ANDROID_OUT=dist/energy-channel-webview timeout 180s node tests/energy-channel-webview.cjs || { timeout 10s adb logcat -d > dist/energy-channel-webview/failure-logcat.txt; timeout 10s adb exec-out screencap -p > dist/energy-channel-webview/failure.png; exit 1; }
      - name: Collect environment evidence
        if: always()
        run: |
          mkdir -p dist/energy-channel-webview
          timeout 10s adb logcat -d > dist/energy-channel-webview/logcat.txt || true
          timeout 10s adb exec-out screencap -p > dist/energy-channel-webview/final.png || true
          cp /tmp/kd-http.log dist/energy-channel-webview/http.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: energy-channel-source-webview-evidence
          path: dist/energy-channel-webview/
