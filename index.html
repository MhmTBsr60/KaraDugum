function filterLevels(){
 if(page!=='levels')return;let visible=0;
 el('kdShell').querySelectorAll('.kdLevel').forEach(tile=>{const earned=Number(tile.dataset.stars)||0;const show=levelFilter==='all'||levelFilter==='open'&&!tile.disabled||levelFilter==='done'&&earned>0||levelFilter==='stars'&&!tile.disabled&&earned<3;tile.hidden=!show;if(show)visible++;});

 const status=el('kdLevelFilterStatus');if(status)status.textContent=visible?levelFilter==='all'?'':visible+' bölüm gösteriliyor.':'Bu filtrede henüz bölüm yok.';
 el('kdShell').querySelectorAll('[data-level-filter]').forEach(button=>{const active=button.dataset.levelFilter===levelFilter;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});
}

</style><script id="kd20-admob-events">(()=>{'use strict';
let pending=null;
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
window.kdRefreshWinRewards=()=>{
 const w=window.kdLastWin,p=document.querySelector('.kdWinPanel');if(!w||!p)return;
 const claimed=!!read('kd64_doubleClaim_'+(w.id||w.level),false);
 const values=p.querySelectorAll('.kdWinStat strong');
 if(claimed&&values.length===5){values[0].textContent=w.pts*2;values[3].textContent='+'+w.xp*2;values[4].textContent='+'+w.coins*2}
 const button=p.querySelector('.kdWinDouble');if(button){button.hidden=claimed;button.disabled=!!pending}
};
window.kdRequestDouble=()=>{
 const w=window.kdLastWin;
 if(!w||pending||read('kd64_doubleClaim_'+(w.id||w.level),false))return;
 if(!window.KaraNative?.rewardedDouble){alert('Reklam yalnızca Android uygulamasında açılır.');return}
 pending={id:w.id,level:w.level,pts:w.pts,xp:w.xp,coins:w.coins};
 window.kdRefreshWinRewards();
 KaraNative.rewardedDouble();
};
const original=window.kdNativeEvent;
window.kdNativeEvent=function(event,payload){
 if(event==='adReward'){
  if(payload==='hint')window.kdHintAdPending=false;
  try{
   if(payload==='hint'){write('kd64_hintCoupons',Math.max(0,Number(read('kd64_hintCoupons',0))||0)+1);window.kdCloudSync?.();const hintButton=document.getElementById('hint');if(hintButton){const free=Number((hintButton.textContent.match(/(\d+) ücretsiz/)||[])[1]||0);hintButton.textContent=free>0?'◈ İPUCU ('+free+' ücretsiz)':'◈ İPUCU ('+Math.floor(Math.max(0,Number(read('kd64_hintCoupons',0))||0))+' kupon)';}alert('🎉 +1 ipucu kuponu kazandın! İPUCU butonuna tekrar bas.');}else if(payload==='double'&&pending){
    const r=pending;pending=null;
    if(read('kd64_doubleClaim_'+(r.id||r.level),false))return;
    write('kd64_doubleClaim_'+(r.id||r.level),true);
    write('kd64_coins',Math.max(0,Number(read('kd64_coins',0))||0)+r.coins);
    write('kd64_xp',Math.max(0,Number(read('kd64_xp',0))||0)+r.xp);
    const best=read('kd64_best',{});best[r.level]=Math.max(Number(best[r.level]||0),r.pts*2);write('kd64_best',best);
    window.kdReloadProgress();window.kdRefreshWinRewards();
    window.kdCloudSync?.();
    alert('🎉 Puan, XP ve kristal ödüllerin 2 katına çıktı!');
   }else if(payload==='coins'){
    write('kd64_coins',Math.max(0,Number(read('kd64_coins',0))||0)+15);
    window.kdCloudSync?.();alert('🎉 +15 kristal kazandın!');
   }
  }catch(e){console.error('Reklam ödülü',e)}return;
 }
 if(event==='adUnavailable'){window.kdHintAdPending=false;pending=null;window.kdRefreshWinRewards();alert('Reklam şu anda hazır değil.');return}
 if(typeof original==='function')return original.apply(this,arguments);
};
})();</script><script src="reward-receipts.js"></script><style id="kd-reward-badge-style">
