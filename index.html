function saveData(){const keys={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^kd(?:3|5|6|61|64)_/.test(k))keys[k]=localStorage.getItem(k)}return JSON.stringify({version:7,exportedAt:new Date().toISOString(),level:unlocked(),completed:read('kd64_completed'),best:read('kd64_best'),keys},null,2)}

let busy=false;const original=new WeakMap();
function translate(){if(busy)return;busy=true;try{
 let code=lang(), d=dict[code]||{},root=document.body;
 document.documentElement.lang=code;document.documentElement.dir=code==='ar'?'rtl':'ltr';
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
 while(node=walker.nextNode()){
  if(!node.parentElement||node.parentElement.closest('script,style,textarea,option,#kdLanguageControl'))continue;
  let raw=original.has(node)?original.get(node):node.nodeValue;
  if(!raw.trim())continue;
  if(!original.has(node))original.set(node,raw);
  let out=raw;
  for(const [tr,value] of Object.entries(d).sort((a,b)=>b[0].length-a[0].length)){
   if(raw.trim()===tr){out=raw.replace(tr,value);break}
  }
  if(out!==node.nodeValue)node.nodeValue=out;
 }

   const row=document.createElement('div');row.className='kdRow';row.id='kdLanguageControl';

   select.onchange=()=>{localStorage.setItem('kd6_lang',select.value);original.clear?.();location.reload()};
   row.append(label,select);panel.appendChild(row)
  }
 }
 }finally{busy=false}}

 observer.observe(document.body,{subtree:true,childList:true,characterData:true});
 translate();
})();

</style><script id="kd20-admob-events">(()=>{'use strict';
let pending=null;
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const write=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
window.kdRefreshWinRewards=()=>{
 const w=window.kdLastWin,p=document.querySelector('.kdWinPanel');if(!w||!p)return;
 const claimed=!!read('kd64_doubleClaim_'+w.level,false);
 const values=p.querySelectorAll('.kdWinStat strong');
 if(claimed&&values.length===5){values[0].textContent=w.pts*2;values[3].textContent='+'+w.xp*2;values[4].textContent='+'+w.coins*2}
 const button=p.querySelector('.kdWinDouble');if(button){button.hidden=claimed;button.disabled=!!pending}
};
window.kdRequestDouble=()=>{
 const w=window.kdLastWin;
 if(!w||pending||read('kd64_doubleClaim_'+w.level,false))return;
 if(!window.KaraNative?.rewardedDouble){alert('Reklam yalnızca Android uygulamasında açılır.');return}
 pending={level:w.level,pts:w.pts,xp:w.xp,coins:w.coins};
 window.kdRefreshWinRewards();
 KaraNative.rewardedDouble();
};
const original=window.kdNativeEvent;
window.kdNativeEvent=function(event,payload){
 if(event==='adReward'){
  try{
   if(payload==='double'&&pending){
    const r=pending;pending=null;
    if(read('kd64_doubleClaim_'+r.level,false))return;
    write('kd64_doubleClaim_'+r.level,true);
    write('kd64_coins',Math.max(0,Number(read('kd64_coins',0))||0)+r.coins);
    write('kd64_xp',Math.max(0,Number(read('kd64_xp',0))||0)+r.xp);
    const best=read('kd64_best',{});best[r.level]=Math.max(Number(best[r.level]||0),r.pts*2);write('kd64_best',best);
    window.kdRefreshWinRewards();
    window.kdCloudSync?.();
    alert('🎉 Puan, XP ve jeton ödüllerin 2 katına çıktı!');
   }else if(payload==='coins'){
    write('kd64_coins',Math.max(0,Number(read('kd64_coins',0))||0)+15);
    window.kdCloudSync?.();alert('🎉 +15 jeton kazandın!');
   }
  }catch(e){console.error('Reklam ödülü',e)}return;
 }
 if(event==='adUnavailable'){pending=null;window.kdRefreshWinRewards();alert('Reklam şu anda hazır değil.');return}
 if(typeof original==='function')return original.apply(this,arguments);
};
})();</script><style id="kd-reward-badge-style">
