<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARA DÜĞÜM — Test Merkezi</title><style>body{margin:0;background:#0b0d12;color:#f5f5f5;font:15px system-ui}header{padding:14px;max-width:920px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{color:#b7beca;margin:8px 0}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #555;background:#202632;color:white}button{cursor:pointer}input{width:95px}iframe{display:block;border:1px solid #4b5563;border-radius:12px;background:#090909;width:min(100%,700px);height:80vh;min-height:600px;margin:12px auto}#status{color:#facc15}</style></head><body><header><h1>◈ KARA DÜĞÜM — Test Merkezi</h1><p>Bu sayfa oyunu gerçek arayüzüyle çalıştırır. Bölüm seçerek ipuçlarını ve özel modları test edebilirsin.</p><nav><label for="level">Bölüm</label><input id="level" type="number" min="1" max="300" value="14"><button id="go">Bölümü aç</button><button id="hint">İpucunu dene</button><button id="restart">Yeniden başlat</button><button id="report">Hata raporunu kopyala</button></nav><p id="status">Test modu: oyun ilerlemesini değiştirmemek için ayrı tarayıcı profilinde veya gizli sekmede kullanılması önerilir.</p></header><iframe id="game" title="KARA DÜĞÜM oyun testi" src="index.html"></iframe><script>
const frame=document.getElementById('game'),level=document.getElementById('level'),status=document.getElementById('status');
function current(){return Math.min(300,Math.max(1,Number(level.value)||14));}
function openLevel(){const n=current();level.value=n;try{frame.contentWindow.localStorage.setItem('kd64_level',String(n));frame.contentWindow.localStorage.setItem('kd_level',String(n));frame.contentWindow.location.reload();status.textContent='Bölüm '+n+' açılıyor.';}catch(e){status.textContent='Bölüm açılamadı: '+e.message;}}
document.getElementById('go').onclick=openLevel;
document.getElementById('hint').onclick=()=>{try{frame.contentDocument.getElementById('hint').click();status.textContent='İpucu tıklandı. Oyundaki mesajı kontrol et.';}catch(e){status.textContent='İpucu testi başarısız: '+e.message;}};
document.getElementById('restart').onclick=()=>{try{frame.contentDocument.getElementById('restart').click();status.textContent='Bölüm yeniden başlatıldı.';}catch(e){status.textContent='Yeniden başlatma başarısız: '+e.message;}};
document.getElementById('report').onclick=async()=>{const report='KARA DÜĞÜM test raporu\nBölüm: '+current()+'\nTarih: '+new Date().toISOString()+'\nNot: ';try{await navigator.clipboard.writeText(report);status.textContent='Rapor panoya kopyalandı.';}catch(e){status.textContent=report;}};
</script></body></html>
